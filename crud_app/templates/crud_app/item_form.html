<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Создать элемент</title>
</head>
<body>
    <h1>Добавление нового элемента</h1>
    <form method="post">
        {% csrf_token %}
        <p><label>Заголовок:<br><input type="text" name="title" required></label></p>
        <p><label>Описание:<br><textarea name="content" required></textarea></label></p>
        <button type="submit">Сохранить</button>
        <a href="{% url 'item_list' %}">Отмена</a>
    </form>
</body>
</html>
